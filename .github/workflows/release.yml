name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/easy-ssh-linux-amd64 main.go
          GOOS=linux GOARCH=arm64 go build -o dist/easy-ssh-linux-arm64 main.go
          GOOS=linux GOARCH=386 go build -o dist/easy-ssh-linux-386 main.go
          GOOS=linux GOARCH=arm go build -o dist/easy-ssh-linux-arm main.go
          GOOS=darwin GOARCH=amd64 go build -o dist/easy-ssh-darwin-amd64 main.go
          GOOS=darwin GOARCH=arm64 go build -o dist/easy-ssh-darwin-arm64 main.go
          GOOS=windows GOARCH=amd64 go build -o dist/easy-ssh-windows-amd64.exe main.go
          GOOS=windows GOARCH=386 go build -o dist/easy-ssh-windows-386.exe main.go

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
